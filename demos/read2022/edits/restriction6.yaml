# Restriction (6): Restriction (5), and two restrictions linking the policy shock to a proxy for it (the purged measure of the
# cash rate from Beckers 2020, series PROXY): the proxy is positively correlated with the policy shock, and the policy shock
# contributes more to the proxy's variance than any other shock (Read, equations 8 to 12).
#
# The proxy enters as a second block, Read's "first-stage regression": the proxy on the VAR's current values and the VAR's
# regressors, with an error of its own and a Jeffreys prior, fitted over the periods where the proxy exists (1994Q1 to 2018Q4)
# while the VAR uses the whole sample. Its response on impact to a shock is then Read's covariance between proxy and shock,
# d chol(Sigma) q_j, so his restrictions (12) are ordinary impact responses.
- include: restriction5.yaml
- add_set: {set: proxies, elements: [beckers]}
- add_block:
    name: proxy
    block:
      inputs:  ["y[series]", "x[outside]"]
      outputs: ["m[proxies]"]
      parameters:
        k:     {shape: [proxies], prior: flat}
        d:     {shape: [proxies, series], prior: flat}
        G:     {shape: [lags, proxies, series], prior: flat}
        H:     {shape: [outside_lags, proxies, outside], prior: flat}
        Omega: {shape: [proxies, proxies], domain: positive_definite, prior: jeffreys}
      shocks:
        "v[proxies]": "multivariate_normal(0, Omega)"
      equations:
        - "m = k + d @ y + sum(l in lags: G[l] @ y(-l)) + sum(l in outside_lags: H[l] @ x(-l)) + v"
- remove_data: {series: PROXY}
- add_data: {series: PROXY, link: {observes: "m[beckers]"}}
- add_restriction: {name: proxy_positive, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0)", require: ">= 0"}}
- add_restriction: {name: proxy_over_other1, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0) - response(m[beckers], eps[other1], horizons=0)", require: ">= 0"}}
- add_restriction: {name: proxy_over_minus_other1, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0) + response(m[beckers], eps[other1], horizons=0)", require: ">= 0"}}
- add_restriction: {name: proxy_over_other2, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0) - response(m[beckers], eps[other2], horizons=0)", require: ">= 0"}}
- add_restriction: {name: proxy_over_minus_other2, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0) + response(m[beckers], eps[other2], horizons=0)", require: ">= 0"}}
- add_restriction: {name: proxy_over_other3, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0) - response(m[beckers], eps[other3], horizons=0)", require: ">= 0"}}
- add_restriction: {name: proxy_over_minus_other3, restriction: {quantity: "response(m[beckers], eps[policy], horizons=0) + response(m[beckers], eps[other3], horizons=0)", require: ">= 0"}}
